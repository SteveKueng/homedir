<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set up a Mac</title>
<style>
  :root { color-scheme: light dark; --bg: #fafafa; --fg: #1d1d1f; --muted: #6e6e73; --box: #fff; --line: #d2d2d7; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --fg: #f5f5f7; --muted: #a1a1a6; --box: #1c1c1e; --line: #38383a; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 17px/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  main { width: min(640px, calc(100% - 32px)); }
  h1 { font-size: 32px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; }
  .cmd { display: flex; gap: 8px; align-items: center; background: var(--box); border: 1px solid var(--line);
         border-radius: 12px; padding: 12px 12px 12px 16px; }
  code { flex: 1; font: 15px ui-monospace, SFMono-Regular, Menlo, monospace; overflow-x: auto; white-space: nowrap; }
  button { font: inherit; font-size: 15px; border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer;
           background: #0071e3; color: #fff; }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Set up a Mac</h1>
  <p>Open Terminal and paste this. It asks for your password once.</p>
  <div class="cmd">
    <code id="c">curl -fsSL https://ikueng.ch/install | bash</code>
    <button onclick="navigator.clipboard.writeText(document.getElementById('c').textContent).then(()=>{this.textContent='Copied'})">Copy</button>
  </div>
  <p style="margin-top:24px"><a href="https://github.com/SteveKueng/homedir">Source on GitHub</a></p>
</main>
</body>
</html>
